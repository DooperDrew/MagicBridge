name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Release Portable Archive
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Stage release files
        shell: pwsh
        run: |
          $stage = "MagicBridge-$($env:GITHUB_REF_NAME)-windows-x64"
          New-Item -ItemType Directory -Path $stage
          Copy-Item target\release\magicbridge-agent.exe $stage\
          Copy-Item target\release\magicbridge-settings.exe $stage\
          Copy-Item README.md $stage\
          Copy-Item CHANGELOG.md $stage\
          if (Test-Path crates\settings\locales) {
            Copy-Item -Recurse crates\settings\locales $stage\locales
          }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          echo "ARCHIVE_PATH=$stage.zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true
