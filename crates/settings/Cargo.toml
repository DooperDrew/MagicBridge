[package]
name = "magicbridge-settings"
description = "MagicBridge settings GUI (egui), runs only while open."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "magicbridge_settings"
path = "src/lib.rs"

[[bin]]
name = "magicbridge-settings"
path = "src/main.rs"

[dependencies]
magicbridge-core.workspace = true
magicbridge-agent.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true
toml.workspace = true
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }

[lints]
workspace = true
